<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>永生办证中心 · HTML 原型 V0.8</title>
<style>
:root {
  --cream: #fdf6e9; --paper: #fffdf8; --mint: #3fae93; --mint-d: #2c8a73; --mint-l: #e2f4ee; --coral: #e9795d; --coral-d: #c75f45; --coral-l: #ffe9e1;
  --ink: #2f443d; --mute: #7b8f87; --line: #e3dccb; --gold: #d99a2b; --blue: #2f6fe0; --purple: #7b3fc4; --bad: #d9534f;
  --r: 12px; --shadow: 0 6px 20px rgba(60, 80, 70, .13);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font: 13px/1.5 "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", "Hiragino Sans GB", system-ui, sans-serif; color: var(--ink); background: var(--cream); overflow: hidden; }
[hidden] { display: none !important; }
button, select, input { font: inherit; color: inherit; }
#app { display: flex; flex-direction: column; height: 100vh; }

/* 顶栏 */
#top { display: flex; align-items: center; gap: 10px; padding: 7px 12px; background: var(--paper); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
#top .brand { font-weight: 800; font-size: 15px; color: var(--coral-d); cursor: pointer; max-width: 230px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#top .brand small { display: block; font-weight: 600; font-size: 10.5px; color: var(--mute); }
.stat { display: flex; flex-direction: column; padding: 2px 10px; border-left: 1px solid var(--line); min-width: 74px; }
.stat b { font-size: 14px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 10.5px; color: var(--mute); }
.stat .up { color: var(--mint-d); } .stat .down { color: var(--bad); }
.grow { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: #fff; }
.seg button { border: 0; background: transparent; padding: 5px 11px; cursor: pointer; font-weight: 700; color: var(--mute); }
.seg button.on { background: var(--mint); color: #fff; }
.seg button:hover:not(.on) { background: var(--mint-l); }

.btn { border: 1px solid var(--line); background: #fff; border-radius: 9px; padding: 4px 10px; cursor: pointer; font-weight: 600; white-space: nowrap; }
.btn:hover { border-color: var(--mint); background: var(--mint-l); }
.btn.pri { background: var(--mint); border-color: var(--mint-d); color: #fff; }
.btn.pri:hover { background: var(--mint-d); }
.btn.warn { background: var(--coral-l); border-color: #f1b9a8; color: var(--coral-d); }
.btn.warn:hover { background: var(--coral); color: #fff; }
.btn.sm { padding: 2px 7px; font-size: 12px; border-radius: 7px; }
.btn:disabled { opacity: .45; cursor: not-allowed; background: #f4f1ea; border-color: var(--line); color: var(--mute); }
.mini { width: 30px; height: 30px; border-radius: 9px; border: 1px solid var(--line); background: rgba(255, 255, 255, .92); cursor: pointer; font-weight: 800; }
.mini:hover { background: var(--mint-l); }
select, input[type=text], input[type=number], input[type=search] { border: 1px solid var(--line); border-radius: 8px; padding: 3px 6px; background: #fff; max-width: 100%; }
select:focus, input:focus { outline: 2px solid var(--mint); outline-offset: 0; }

/* 主体 */
main { flex: 1; display: flex; min-height: 0; }
#mapcol { flex: 1 1 58%; min-width: 50%; display: flex; flex-direction: column; min-height: 0; }
#mapwrap { position: relative; flex: 1; min-height: 0; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; touch-action: none; }
#alerts { position: absolute; left: 10px; top: 10px; display: flex; flex-direction: column; gap: 5px; max-width: 46%; pointer-events: none; }
.alert { pointer-events: auto; background: rgba(255, 253, 248, .95); border: 1px solid var(--line); border-left: 4px solid var(--gold); border-radius: 9px; padding: 3px 9px; cursor: pointer; font-size: 12px; box-shadow: 0 2px 8px rgba(60, 80, 70, .08); }
.alert.bad { border-left-color: var(--bad); } .alert.ask { border-left-color: var(--purple); } .alert.good { border-left-color: var(--mint); }
.alert:hover { background: #fff; }
#petcard { position: absolute; right: 10px; top: 10px; width: 330px; max-width: 60%; }
.pet { background: #fbf4ff; border: 1px solid #d9bdf0; border-radius: var(--r); padding: 10px 12px; box-shadow: var(--shadow); margin-bottom: 8px; }
.pet h4 { margin: 0 0 4px; color: var(--purple); font-size: 13px; }
.pet q { display: block; font-style: italic; color: #5a3f78; margin: 4px 0 6px; }
.pet .row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
#mapctl { position: absolute; right: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 5px; }
#legend { position: absolute; left: 10px; bottom: 10px; background: rgba(255, 253, 248, .9); border: 1px solid var(--line); border-radius: 9px; padding: 4px 9px; font-size: 11px; color: var(--mute); display: flex; gap: 10px; flex-wrap: wrap; max-width: 70%; }
#legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 3px; vertical-align: -1px; }
#subtitle { position: absolute; left: 50%; bottom: 46px; transform: translateX(-50%); background: rgba(47, 68, 61, .86); color: #fff; padding: 5px 14px; border-radius: 999px; font-size: 12.5px; max-width: 80%; text-align: center; opacity: 0; transition: opacity .4s; pointer-events: none; }
#subtitle.on { opacity: 1; }
#logbox { height: 132px; overflow-y: auto; background: var(--paper); border-top: 1px solid var(--line); padding: 5px 10px; font-size: 12px; }
.lg { padding: 1px 0; border-bottom: 1px dashed #efe8d8; }
.lg time { color: var(--mute); margin-right: 6px; font-variant-numeric: tabular-nums; }
.lg.k-key { color: #7a4b00; font-weight: 600; } .lg.k-ask { color: var(--purple); font-weight: 600; } .lg.k-bad { color: var(--bad); } .lg.k-good { color: var(--mint-d); } .lg.k-cast { color: var(--mute); font-style: italic; }

/* 右侧面板 */
#panel { flex: 0 0 42%; max-width: 620px; min-width: 380px; display: flex; flex-direction: column; background: var(--paper); border-left: 1px solid var(--line); min-height: 0; }
#tabs { display: flex; border-bottom: 1px solid var(--line); }
#tabs button { flex: 1; border: 0; background: transparent; padding: 9px 4px; cursor: pointer; font-weight: 700; color: var(--mute); border-bottom: 3px solid transparent; }
#tabs button.on { color: var(--mint-d); border-bottom-color: var(--mint); background: var(--mint-l); }
#tabs button .dot { display: inline-block; min-width: 16px; padding: 0 4px; border-radius: 9px; background: var(--coral); color: #fff; font-size: 10.5px; margin-left: 4px; }
#tabbody { flex: 1; overflow-y: auto; padding: 10px 12px 30px; }
h3 { margin: 14px 0 6px; font-size: 13.5px; color: var(--mint-d); display: flex; align-items: center; gap: 6px; }
h3:first-child { margin-top: 0; }
h3 small { font-weight: 500; color: var(--mute); font-size: 11.5px; }
.card { background: #fff; border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; margin-bottom: 7px; }
.card.hl { border-color: var(--coral); box-shadow: 0 0 0 2px var(--coral-l); }
.row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.row.sp { justify-content: space-between; }
.mut { color: var(--mute); } .sm { font-size: 11.5px; } .b { font-weight: 700; }
.ok { color: var(--mint-d); } .bad { color: var(--bad); } .warnc { color: var(--gold); } .pur { color: var(--purple); }
.tag { display: inline-block; padding: 0 7px; border-radius: 999px; font-size: 11px; font-weight: 600; background: #f0ece0; color: #6b6248; white-space: nowrap; }
.tag.g { background: var(--mint-l); color: var(--mint-d); } .tag.r { background: var(--coral-l); color: var(--coral-d); } .tag.b { background: #e3ecff; color: #2a57b5; } .tag.p { background: #f1e6fb; color: var(--purple); } .tag.y { background: #fff1cf; color: #8a6200; }
.sw { display: inline-block; width: 11px; height: 11px; border-radius: 4px; vertical-align: -1px; }
.bar { display: inline-block; width: 70px; height: 7px; border-radius: 4px; background: #ece6d6; overflow: hidden; vertical-align: middle; }
.bar i { display: block; height: 100%; background: var(--mint); border-radius: 4px; }
.bar.r i { background: var(--coral); } .bar.y i { background: var(--gold); } .bar.w { width: 110px; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th { text-align: left; color: var(--mute); font-weight: 600; padding: 3px 4px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 4px 4px; border-bottom: 1px solid #f1ecdf; vertical-align: top; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--mint-l); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; }
.kv dt { color: var(--mute); } .kv dd { margin: 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; }
.hint { background: #fff8e6; border: 1px dashed #ecd9a6; border-radius: 9px; padding: 5px 9px; font-size: 12px; color: #7a5f1c; margin: 6px 0; }
.sat { font-style: italic; color: var(--mute); font-size: 11.5px; }

/* 弹窗 */
#modal { position: fixed; inset: 0; background: rgba(47, 68, 61, .32); display: flex; align-items: center; justify-content: center; z-index: 30; padding: 18px; }
.dlg { background: var(--paper); border-radius: 16px; box-shadow: 0 16px 50px rgba(40, 60, 50, .3); width: 640px; max-width: 100%; max-height: 100%; display: flex; flex-direction: column; overflow: hidden; }
.dlg.wide { width: 760px; }
.dlg > header { display: flex; align-items: center; gap: 10px; padding: 11px 14px; background: linear-gradient(90deg, var(--mint-l), #fff6ea); border-bottom: 1px solid var(--line); }
.dlg > header h2 { margin: 0; font-size: 16px; flex: 1; }
.dlg > header h2 small { font-size: 11.5px; font-weight: 500; color: var(--mute); margin-left: 6px; }
.dlg .x { border: 0; background: transparent; font-size: 20px; cursor: pointer; color: var(--mute); line-height: 1; }
.dlg .body { padding: 12px 14px 16px; overflow-y: auto; }
.dtabs { display: flex; gap: 4px; padding: 8px 14px 0; border-bottom: 1px solid var(--line); }
.dtabs button { border: 1px solid var(--line); border-bottom: 0; background: #f6f1e4; border-radius: 9px 9px 0 0; padding: 5px 12px; cursor: pointer; font-weight: 700; color: var(--mute); }
.dtabs button.on { background: var(--paper); color: var(--mint-d); position: relative; top: 1px; }
.avatar { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, .12); }
.buildgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.buildgrid .card { cursor: pointer; margin: 0; }
.buildgrid .card:hover { border-color: var(--mint); background: var(--mint-l); }
.buildgrid .card.dis { opacity: .5; cursor: not-allowed; }
.buildgrid .card.dis:hover { border-color: var(--line); background: #fff; }

/* 开局 */
#start { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; padding: 20px; overflow: auto;
  background: radial-gradient(1200px 600px at 20% 10%, #dff3ec, transparent), radial-gradient(900px 600px at 90% 90%, #ffe4d9, transparent), var(--cream); }
.startbox { background: var(--paper); border-radius: 20px; box-shadow: var(--shadow); padding: 26px 30px; width: 560px; max-width: 100%; }
.startbox h1 { margin: 0; font-size: 28px; color: var(--coral-d); letter-spacing: 2px; }
.startbox .en { color: var(--mute); letter-spacing: 3px; font-size: 11.5px; margin-bottom: 12px; }
.startbox label { display: block; margin: 10px 0 3px; font-weight: 700; }
.startbox input[type=text] { width: 100%; padding: 7px 10px; font-size: 14px; }
.startbox .go { margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap; }
.startbox .go .btn { padding: 8px 16px; font-size: 14px; }
.startbox ul { margin: 8px 0 0; padding-left: 18px; color: #5a6e66; font-size: 12.5px; }
.err { color: var(--bad); font-size: 12px; min-height: 18px; }

#toast { position: fixed; left: 50%; top: 62px; transform: translateX(-50%); z-index: 60; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
.toast { background: rgba(47, 68, 61, .93); color: #fff; padding: 6px 14px; border-radius: 999px; box-shadow: var(--shadow); font-size: 12.5px; max-width: 80vw; animation: tin .2s ease-out; }
.toast.bad { background: rgba(190, 60, 55, .95); }
@keyframes tin { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }

@media (max-width: 1000px) {
  #panel { flex-basis: 40%; min-width: 320px; }
  .stat { min-width: 60px; padding: 2px 6px; }
}

</style>
</head>

<div id="app" hidden>
  <header id="top"></header>
  <main>
    <section id="mapcol">
      <div id="mapwrap">
        <canvas id="map"></canvas>
        <div id="alerts"></div>
        <div id="petcard"></div>
        <div id="mapctl">

          <button class="mini" data-act="zoom" data-a="0.83" title="缩小">－</button>
          <button class="mini" data-act="zoom" data-a="0" title="复位视角">⌂</button>
        </div>
        <div id="legend"></div>
        <div id="subtitle"></div>
      </div>
      <div id="logbox"></div>
    </section>
    <aside id="panel">
      <nav id="tabs"></nav>
      <div id="tabbody"></div>
    </aside>
  </main>
</div>
<div id="start"></div>
<div id="modal" hidden></div>
<div id="toast"></div>
<input type="file" id="importfile" accept=".json,application/json" hidden>

}

}
function totals(c) {
  const t = { due: 0, paid: 0, refund: 0, net: 0, unpaid: 0, cost: 0, gross: 0, est: 0, byCat: {} };
  for (const v of c.inv) {
    t.due += v.due; t.paid += v.paid; t.refund += v.refund || 0;
    if (v.st === 'esc' || v.st === 'open') t.unpaid += v.due - v.paid;
    if (v.st === 'paid' || v.st === 'esc') t.cost += v.cost;
    t.byCat[v.cat] = (t.byCat[v.cat] || 0) + v.paid;
  }
  t.net = t.paid - t.refund;
  t.gross = t.net - t.cost;
  const perVisit = S.stats.visits ? Math.round(S.stats.overhead / S.stats.visits) : 0;
  t.share = perVisit * c.visitN;
  t.est = t.gross - t.share;
  return t;
}

// ---------- 成绩模型与“估计通过率” ----------
const EXAM_SD = 8;
function examMean(c, course, kind) {
  const co = D.COURSE[course];
  const apt = kind === 'w' ? c.aptW[course] : c.aptP[course];
  let m = 37 + 0.3 * apt + 0.34 * (c.prep[course] || 0) - 0.12 * c.stress - co.diff;
  if (kind === 'p') m += 4;
  if (kind === 'p' && c.species === 'alien' && co.alienPen && !S.policies.alienEquiv) m -= co.alienPen;
  return m + (c.examBonus || 0);
}
function phi(z) {
  const t = 1 / (1 + 0.2316419 * Math.abs(z)), d = 0.3989423 * Math.exp(-z * z / 2);
  const p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274))));
  return z > 0 ? 1 - p : p;
}
function estPass(c, course, kind) {
  const co = D.COURSE[course], line = kind === 'w' ? co.wLine : co.pLine;
  const p = 1 - phi((line - 0.5 - examMean(c, course, kind)) / EXAM_SD);
  return clamp(Math.round(p * 20) * 5, 5, 95);
}

function stepsFor(c, type, a) {

}
function spawnCitizen(c) {
  const type = c.plan.type;
  const a = { id: nid(), k: 'cit', cid: c.id, x: OUTSIDE.x, y: OUTSIDE.y, px: OUTSIDE.x, py: OUTSIDE.y, path: [], place: OUTSIDE, st: 'idle', steps: [], si: -1,
    room: 0, staff: 0, wait: 0, tw: 0, svc: 0, evade: false, book: false, buy: null, type, bub: '', paid: false, gated: false };
  a.steps = stepsFor(c, type, a);

  c.plan = null; c.status = 'visit'; c.agent = a.id; c.visitN++; c.lastVisit = S.day; c.note = '';
  if (!c.firstDay) c.firstDay = S.day;

  S.stats.visits++; daily(S.day).vis++;

function pickRoom(type) {

}
function nextStep(a) {

}
function onNoRoom(c, step) {

  else if (step === 'report') beh(c, '上报未果', '中心尚未建成资格汇总与上报处');

}

function requeue(rm) {

// ---------- 出口：离场前结算或逃单（成功离场后永不追缴） ----------
function gateInspector() {
  for (const s of S.staff) {
    if (s.job !== 'inspector' || s.duty !== 'gate' || s.st !== 'post') continue;
    const ag = A(s.agent);
    if (ag && !ag.off && ag.x < HALL_W + 0.5 && Math.abs(ag.y - MAP.gateY) < 4) return s;
  }
  return null;
}
function gateWhy() {
  const ins = S.staff.filter(s => s.job === 'inspector');
  if (!ins.length) return '本中心没有巡查员';
  const g = ins.filter(s => s.duty === 'gate');
  if (!g.length) return '巡查员未被指派大门稽核';
  if (g.some(s => s.st === 'rest' || s.st === 'toRest' || s.st === 'toPost')) return '守门巡查员休息中';
  if (g.some(s => s.st === 'leave' || s.st === 'away')) return '守门巡查员今日不在岗';
  return '守门巡查员未能及时发现';
}
function gateCheck(a, c) {
  a.gated = true;
  const opens = openInvs(c);
  if (!opens.length) return;
  const sum = opens.reduce((n, v) => n + v.due, 0);
  const s = gateInspector();
  if (s && chance(0.85)) {
    for (const v of opens) payInv(c, v, '大门稽核·离场前当场结清');
    S.stats.intercepted++; s.caught = (s.caught || 0) + 1;
    beh(c, '当场结清', '离场前被巡查员 ' + s.name + ' 在出口线内拦下，当场结清 ' + sum);
    log('🛡 ' + s.name + ' 在出口线内拦下 ' + c.name + '，当场结清 ' + sum + '（离场前结算，不是追缴）。', 'good');
    FX.push('cash');
    return;
  }
  const why = a.evade ? gateWhy() : '收费窗口无人，未能结清';
  for (const v of opens) markEscaped(c, v, why);
  a.bub = '💨';
  beh(c, '逃单离场', '未结清 ' + sum + ' 离场（' + why + '）；已跨过离场线，不追缴');
  log('💨 ' + c.name + ' 带着未缴 ' + sum + ' 离场（' + why + '）。该欠款只留档，不追缴。', 'bad');
  FX.push('alert');
}
function finalize(a, c) {
  const dd = daily(S.day);
  dd.wn = (dd.wn || 0) + 1; dd.ws = (dd.ws || 0) + a.tw;
  if (a.tw > 60) addTrust(-0.2);
  removeAgent(a);
  c.agent = 0;
  if (c.status === 'visit') c.status = 'home';
  autoPlan(c);
}

// ---------- 离馆后的下一步（兜底规划，幂等） ----------
function autoPlan(c) {
  if (c.plan || c.agent) return;
  if (c.status === 'waitLevel') c.status = 'home';
  c.note = '';
  if (!c.registered) { c.plan = { type: 'register', day: S.day + 1 }; return; }
  if (c.docs.pending) { c.plan = { type: 'docs', day: S.day + 2 }; return; }
  if (!c.docs.ok) { c.plan = { type: 'docs', day: S.day + 1 }; return; }
  if (c.booking) { c.plan = { type: c.booking.kind === 'w' ? 'examW' : 'examP', day: c.booking.day }; return; }
  if (c.paper) {
    const p = PAPER(c.paper);
    if (p && p.pub) c.plan = { type: 'check', day: Math.max(S.day + 1, p.planned) };
    else c.note = '等待阅卷与成绩发布';
    return;
  }
  if (c.tutorLeft > 0) { c.plan = { type: 'tutor', day: S.day + 1 }; return; }
  if (c.license) {
    if (c.slot === 'active') {
      if (staffed('pod')) c.plan = { type: 'pod', day: S.day + ri(6, 10) };
      else c.note = '名额已激活，等待中心开放修复舱';
    } else c.note = '公开候补生命维护名额';
    return;
  }
  if (c.reported) { c.note = '等待上级系统电子回执'; return; }
  const ne = nextExam(c);
  if (!ne) {
    if (hasRoom('report')) c.plan = { type: 'report', day: S.day + ri(1, 2) };
    else c.note = '七项认证齐全，等待中心建成资格汇总与上报处';
    return;
  }
  if (D.COURSE[ne.course].level > S.level) { c.status = 'waitLevel'; c.note = '等待中心课程资质（' + D.COURSE[ne.course].short + '）'; return; }
  if (ne.kind === 'p' && !hasRoom('practical')) { c.note = '等待中心建成实操室'; return; }
  c.plan = { type: 'book', day: Math.max(S.day + 1, c.study ? c.study.until : S.day + ri(1, 3)) };
}

// ---------- 每分钟推进一名到访公民 ----------
function updCitizen(a) {
  const c = C(a.cid);
  if (a.path.length) {
    stepAgent(a);
    if (a.st === 'leave' && !a.gated && a.x <= 1.2) gateCheck(a, c);
    if (!a.path.length) onArrive(a, c);
    return;
  }
  a.px = a.x; a.py = a.y;
  if (a.st === 'q') {
    a.wait++; a.tw++;
    if (a.tw > 20 && a.tw % 15 === 0) c.patience = clamp(c.patience - 1, 0, 100);
    a.bub = a.wait > 25 ? '⏳' : '';
    const opt = STEP[a.steps[a.si]].opt;
    if (opt && a.wait > opt) { dropFromQueue(a); beh(c, '放弃等候', '等待过久，放弃本次' + D.ROOMS[STEP[a.steps[a.si]].rt].short); nextStep(a); }
  } else if (a.st === 'svc') {
    const s = St(a.staff), step = a.steps[a.si];
    if (!s) { a.st = 'walk'; const rm = Rm(a.room); if (rm) { rm.q.unshift(a.id); a.st = 'q'; requeue(rm); } return; }
    a.svc += staffEff(s); s.work++;
    if (a.svc >= STEP[step].dur) { s.busy = 0; s.served++; finishService(a, c, step, s); }
  } else if (a.st === 'exam' && a.cheatAt === S.minute) resolveCheat(a, c);
}
function onArrive(a, c) {
  if (a.st === 'walk') {
    const rm = Rm(a.room), step = a.steps[a.si];
    if (!rm) return nextStep(a);
    if (step === 'petition') return startPetition(a, c, rm);
    rm.q.push(a.id); a.st = 'q'; requeue(rm);
  } else if (a.st === 'toSvc') { a.st = 'svc'; a.svc = 0; a.bub = '💬'; }
  else if (a.st === 'toSeat') { a.st = 'seat'; a.bub = ''; }
  else if (a.st === 'leave') finalize(a, c);
}
function updRoomService(rm) {
  if (!rm.q.length || !SERVICE_ROOMS[rm.type]) return;
  for (const s of S.staff) {
    if (s.room !== rm.id || !present(s) || s.busy) continue;
    if (D.JOBS[s.job].room !== rm.type) continue;
    const a = A(rm.q.shift());
    if (!a) { if (!rm.q.length) break; continue; }
    s.busy = a.id; a.staff = s.id; a.st = 'toSvc';
    const cp = CUST[rm.type][s.station] || CUST[rm.type][0];
    setDest(a, { r: rm.id, lx: cp[0], ld: cp[1] });
    requeue(rm);
    if (!rm.q.length) break;
  }
}

// ---------- 各窗口办结效果 ----------
function finishService(a, c, step, s) {
  switch (step) {
    case 'reg':
      visitFee(c, 'reception');
      invoice(c, '首次建档登记费', 'reg', D.FEES.reg, 0, 'reception');
      c.registered = true;
      beh(c, '建档', '完成身份登记与考试学籍建档');
      break;
    case 'review': doReview(a, c, s); break;
    case 'cashier': doCashier(a, c); break;
    case 'check': doCheck(a, c); break;
    case 'bookstore': doBookstore(a, c); break;
    case 'tutor': {
      visitFee(c, 'tutoring');
      const cur = curCourse(c), gain = Math.round(8 * staffEff(s));
      const v = invoice(c, '一对一私教（当日一节）', 'tutor', D.FEES.tutor, 0, 'tutoring');
      if (cur) c.prep[cur] = clamp(c.prep[cur] + gain, 0, 100);
      c.tutorLeft--; c.stress = clamp(c.stress - 2, 0, 100);
      beh(c, '私教', '完成一节一对一私教，准备度 +' + gain + '，剩余 ' + c.tutorLeft + ' 节', { inv: v.id });
      if (c.tutorLeft <= 0) { c.tutorLeft = 0; a.book = true; a.steps.push('cashier'); }
      break;
    }
    case 'counsel': {
      visitFee(c, 'counsel');
      const v = invoice(c, '心理辅导（自愿）', 'counsel', D.FEES.counsel, 0, 'counsel');
      c.stress = clamp(c.stress - 18, 0, 100); c.patience = clamp(c.patience + 8, 0, 100);
      beh(c, '心理辅导', '完成一次自愿心理辅导（内容保密）', { inv: v.id });
      break;
    }
    case 'report': {
      if (c.reported || nextExam(c) || certCount(c) < 7) break;
      visitFee(c, 'report');
      const v = invoice(c, '成绩核验与电子许可上报服务费', 'report', D.FEES.report, 0, 'report');
      c.reported = S.day;
      beh(c, '汇总上报', '七项认证汇总上报上级生命许可系统，等待电子回执', { inv: v.id });
      log('📤 ' + c.name + ' 七项认证齐全，已汇总上报。最终许可由上级电子签发，本中心不制证。', 'good');
      break;
    }
    case 'pod': {
      if (c.slot !== 'active') break;
      visitFee(c, 'pod');
      const v = invoice(c, '修复舱常规维护服务', 'pod', D.FEES.pod, D.COSTS.pod, 'pod');
      cashMove('podcost', -D.COSTS.pod, '修复舱耗材/能源/折旧', c.id);
      c.pods++;
      beh(c, '修复舱', '完成第 ' + c.pods + ' 次修复舱维护', { inv: v.id });
      FX.push('pod');
      if (!c.books['ANN@' + S.edition] && (S.stock.ANN || 0) > 0 && chance(0.3)) { a.buy = ['ANN']; a.steps.push('bookstore'); }
      break;
    }
  }
  nextStep(a);
}
function doReview(a, c, s) {
  visitFee(c, 'review');
  const ret = c.docs.pending;
  let miss = false, bribed = false;
  if (ret) { consultFee(c); bribed = tryBribe(a, c, s); }
  if (!bribed && c.docs.n < 2) {
    let p = ret ? 0.25 : 0.32;
    if (S.policies.eDocs) p *= 0.5;
    miss = chance(p);
  }
  if (miss) {
    c.docs.n++; c.docs.pending = true; c.docs.name = pick(D.DOCS);
    consultFee(c);
    a.book = false; a.steps.length = a.si + 1;
    c.plan = { type: 'docs', day: S.day + 2 };
    beh(c, '缺件', '材料审核发现缺少' + c.docs.name + '，需回家补件后返访（第 ' + c.docs.n + ' 次）');
  } else {
    c.docs.pending = false; c.docs.ok = true; a.book = true;
    if (a.steps.indexOf('cashier', a.si) < 0) a.steps.push('cashier');
    beh(c, '材料审核', ret ? '补件齐全，材料审核通过' : '材料齐全，一次通过审核');
  }
}
function doCashier(a, c) {
  visitFee(c, 'cashier');
  if (a.book) {
    a.book = false;
    const booked = bookExam(c);
    if (booked && a.type === 'register' && curCourse(c) === 'C01' && chance(0.3 + (100 - c.fin) * 0.003)) { a.buy = ['TC01']; a.steps.push('bookstore'); }
  }
  let sum = 0;
  for (const v of openInvs(c)) sum += payInv(c, v, '收费室');
  if (sum) { a.bub = '💰'; FX.push('cash'); }
  a.paid = true;
}
function sellBook(c, sku, evade) {
  const b = D.BOOKS[sku], cur = curCourse(c);
  if (!b || !bookAllowed(sku)) return null;
  const tag = sku + (b.course ? '' : ':' + (cur || '-'));
  if (c.books[tag + '@' + S.edition]) return null;
  let ed = S.edition, price = b.price, old = false, uc = b.cost;
  const hasNew = (S.stock[sku] || 0) > 0, hasOld = S.policies.oldEd && (S.old[sku] || 0) > 0 && !c.books[tag + '@' + S.oldEd];
  if (hasOld && (!hasNew || chance(0.6))) { old = true; ed = S.oldEd; price = Math.round(b.price * 0.6); }
  else if (!hasNew) { beh(c, '书店断货', b.name + ' 无库存，改用免费公开考纲'); return null; }
  if (old) S.old[sku]--;
  else { uc = Math.round(S.stockCost[sku] / S.stock[sku]); S.stockCost[sku] -= uc; S.stock[sku]--; }
  c.books[tag + '@' + ed] = S.day;
  const target = b.course || cur, gain = b.prep - (old ? 2 : 0);
  if (target) c.prep[target] = clamp(c.prep[target] + gain, 0, 100);
  const v = invoice(c, b.name + '（第' + ed + '版' + (old ? '·旧版互认折价' : '') + '）', 'book', price, uc, 'bookstore');
  S.stats.books++;
  if (!evade) payInv(c, v, '书店收银台');
  beh(c, '购书', '自愿购买' + b.name + ' 第' + ed + '版，准备度 +' + gain + (evade ? '（未在收银台付款）' : ''), { inv: v.id });
  return v;
}
function doBookstore(a, c) {
  let any = false;
  for (const sku of a.buy || []) if (sellBook(c, sku, a.evade)) any = true;
  a.buy = null;
  if (any) { visitFee(c, 'bookstore'); if (!a.evade) FX.push('cash'); }
}

// ---------- 查分：本人到窗口那一刻才知悉成绩并改变学籍 ----------
function doCheck(a, c) {
  const p = c.paper ? PAPER(c.paper) : null;
  visitFee(c, 'reception');
  if (!p || !p.pub) { beh(c, '查分', '成绩尚未发布，改日再来'); return; }
  p.chk = S.day; c.paper = 0; c.lastCheck = S.day;
  const co = D.COURSE[p.course], rec = c.rec[p.course], isW = p.kind === 'w', line = isW ? co.wLine : co.pLine;
  const pass = !p.viol && p.score >= line, kname = isW ? '笔试' : '实操';
  if (isW) { rec.wScore = p.score; rec.wTries++; } else { rec.pScore = p.score; rec.pTries++; }
  rec.hist.push({ k: p.kind, s: p.score, d: p.sub, c: S.day, ok: pass, viol: p.viol });
  if (pass) {
    rec[p.kind] = 'pass';
    c.stress = clamp(c.stress - 6, 0, 100); c.patience = clamp(c.patience + 6, 0, 100);
    beh(c, '查分', '「' + co.short + '」' + kname + ' ' + p.score + ' 分，合格（合格线 ' + line + '；' + dateStr(p.sub) + '考试，' + dateStr(p.pub) + '发布）');
    FX.push('pass');
    if (isW && !pDone(rec) && S.policies.expRecog && c.exp.indexOf(p.course) >= 0) {
      rec.p = 'equiv'; S.stats.equiv++;
      beh(c, '等效认定', '已验证的对口职业资历获实操等效认定，免于重复初级实操');
    }
    if (wDone(rec) && pDone(rec)) afterCert(c, p.course, a);
    else { a.book = true; a.steps.push('cashier'); }
  } else {
    rec[p.kind] = 'fail';
    if (isW) rec.wFails++; else rec.pFails++;
    c.stress = clamp(c.stress + 6 + Math.round((100 - c.tr.resilience) / 12), 0, 100);
    c.patience = clamp(c.patience - 8 - Math.round((100 - c.tr.resilience) / 14), 0, 100);
    beh(c, '查分', '「' + co.short + '」' + kname + (p.viol ? ' 因违纪成绩无效' : ' ' + p.score + ' 分，未通过（合格线 ' + line + '）'));
    FX.push('fail');
    afterFail(c, p.course, p.kind, a, true);
  }
}
// 取得一项完整认证之后（a 可为空：不在馆内时由免考认定触发）
function afterCert(c, course, a) {
  const rec = c.rec[course], co = D.COURSE[course];
  if (rec.cert) return;
  rec.cert = true; rec.certDay = S.day;
  S.stats.certs++; addTrust(0.03);
  c.stress = clamp(c.stress - 12, 0, 100); c.patience = clamp(c.patience + 12, 0, 100);
  c.study = null; c.strategy = '';
  beh(c, '取得认证', '取得' + co.name + '（' + certCount(c) + '/7）');
  log('📜 ' + c.name + ' 取得' + co.name + '（' + certCount(c) + '/7）。', 'good');
  const ne = nextExam(c);
  if (!ne) { if (a && hasRoom('report')) a.steps.push('report'); return; }
  if (D.COURSE[ne.course].level > S.level) { beh(c, '等待资质', '下一科「' + D.COURSE[ne.course].short + '」超出本中心等级授权，回家等待'); return; }
  if (a && chance(0.25 + (100 - c.fin) * 0.004 + c.tr.discipline * 0.002)) { a.buy = ['T' + ne.course]; a.steps.push('bookstore'); }
  c.study = { until: S.day + ri(2, 5), rate: studyRate(c) };
  c.plan = { type: 'book', day: c.study.until };
}

function examStaff(rm) { return S.staff.filter(s => s.room === rm.id && present(s) && D.JOBS[s.job].room === rm.type); }

function updExams() {

    const isW = ses.kind === 'w', t0 = isW ? D.W_SLOTS[ses.slot] : D.P_SLOTS[ses.slot], dur = isW ? D.W_DUR : D.P_DUR;
    const rm = Rm(ses.room);

        if (isW) { log('🔔 ' + timeStr(m) + ' 「' + D.COURSE[ses.course].short + '」笔试开考，预约 ' + ses.cids.length + ' 人。', 'info'); FX.push('bell'); }
      } else if (m >= t0 + (isW ? 20 : 15)) { cancelSession(ses, isW ? '笔试厅无监考员在岗' : '实操室无考评员在岗'); continue; }

// ---------- 阅卷与发布 ----------
function sampleCheckDelay(atStart) {
  const r = R();
  let d = r < 0.45 ? 0 : r < 0.62 ? 1 : r < 0.75 ? 2 : r < 0.87 ? ri(3, 4) : r < 0.95 ? ri(5, 7) : ri(8, 12);
  if (!atStart && d < 1) d = 1;
  return d;
}
function publish(p, atStart) {
  if (p.pub) return;
  p.pub = S.day;
  p.planned = S.day + sampleCheckDelay(atStart);
  const c = C(p.cid);
  if (c && !c.agent && !c.plan) c.plan = { type: 'check', day: p.planned };
}
function updGrading() {
  if (!S.gq.length) return;
  let cap = 0;
  for (const s of S.staff) {
    if (s.job !== 'grader' || !present(s) || !s.room) continue;
    cap += staffEff(s); s.work++;
  }
  if (S.policies.aiGrading) cap *= 1.8;
  while (cap > 0 && S.gq.length) {
    const p = PAPER(S.gq[0]);
    if (!p) { S.gq.shift(); continue; }
    const need = p.kind === 'w' ? 22 : 10, take = Math.min(cap, need - p.prog);
    p.prog += take; cap -= take;
    if (p.prog >= need - 1e-9) {
      p.mk = S.day; S.gq.shift();
      if (S.day > p.sub) publish(p, false);
    }
  }
}
function publishDue() {
  let n = 0;
  for (const p of S.papers) if (p.mk && !p.pub && p.sub < S.day) { publish(p, true); n++; }
  if (n) log('📢 今日发布 ' + n + ' 份成绩（后台可查；须本人返访查分后才知悉并生效）。', 'info');
}

const TEMP_DAYS = [3, 5, 7, 10];

const fail = msg => ({ ok: false, msg });

// ---------- 员工 ----------
function staffSkill(s) { return s.temp ? (s.skills[D.JOBS[s.job].skill] || 50) : s.quality; }

function freeStation(rm, except) {

}

    const i = freeStation(rm, s), n = S.staff.filter(x => x !== s && x.room === rm.id).length;
    if (i >= 0 && n < bn) { best = rm; bi = i; bn = n; }

}

    quality: 60, mismatch: false, origin: '', rested: false, lounge: false, why: '', caught: 0, nextMove: 0, patrol: 0, bribes: 0,

}
function inspectorPost(s) {

function tick() {

  for (let i = S.upQ.length - 1; i >= 0; i--) if (S.upQ[i].m <= m) { spawnUpper(S.upQ[i].role); S.upQ.splice(i, 1); }
  for (const a of S.agents.slice()) {

    if (a.k === 'cit') updCitizen(a); else if (a.k === 'stf') updStaffAgent(a); else updUpper(a);
  }
  for (const rm of S.rooms) updRoomService(rm);
  updExams();
  updGrading();
  if (m === S.bcast) log('📢 ' + pick(D.BROADCASTS), 'cast');
  if (m >= D.DAY_END) { endDay(); startDay(); FX.push('day'); return true; }
  return false;
}
function runDays(n) {

}
function runToKey(maxDays) {

  while (S.day < target && S.keySeq === k0 && guard-- > 0) tick();

}

    const lp = P(1.25, 11.1);
    ctx.font = '600 9px sans-serif'; ctx.fillStyle = '#e2603e'; ctx.textAlign = 'center'; ctx.fillText('离场线', lp[0], lp[1] + 6);
  }

  function toWorld(mx, my) {
    const lx = (mx - view.tx) / view.s, ly = (my - view.ty) / view.s;
    const u = (lx - OX) / HW, v = (ly - OY) / HH;
    return { x: (u + v) / 2, y: (v - u) / 2, lx, ly };
  }
  function pick(mx, my) {
    const S = IB.S, w = toWorld(mx, my);
    let best = null, bd = 16;
    for (const a of S.agents) {
      const p = P(a._sx == null ? a.x : a._sx, a._sy == null ? a.y : a._sy);
      const d = Math.hypot(p[0] - w.lx, p[1] - 10 - w.ly);
      if (d < bd) { bd = d; best = a; }
    }
    if (best) return { agent: best };
    if (w.x >= G.HALL_W && w.x < G.MAP.w) {
      const col = Math.floor((w.x - G.HALL_W) / G.LOT_W);
      for (let r = 0; r < G.ROWS.length; r++) {
        if (w.y >= G.ROWS[r].y && w.y < G.ROWS[r].y + G.LOT_D) {
          const lot = r * G.LOT_COLS + col;
          return { lot, room: S.rooms.find(q => q.lot === lot) || null };
        }
      }
    }
    return {};
  }
  function resize() {
    if (!cv) return;
    const r = cv.getBoundingClientRect();
    dpr = Math.min(2, window.devicePixelRatio || 1);
    cw = Math.max(50, r.width); ch = Math.max(50, r.height);
    cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  }
  function init(canvas, cb) {
    cv = canvas; ctx = cv.getContext('2d');
    resize();
    window.addEventListener('resize', resize);
    let drag = null, moved = false;
    const pos = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
    cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, px: view.px, py: view.py }; moved = false; cv.setPointerCapture(e.pointerId); });
    cv.addEventListener('pointermove', e => {
      if (drag) {
        const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
        if (Math.abs(dx) + Math.abs(dy) > 5) moved = true;
        if (moved) { view.px = drag.px + dx; view.py = drag.py + dy; cv.style.cursor = 'grabbing'; }
        return;
      }
      if (!IB.S) return;
      const [mx, my] = pos(e), hit = pick(mx, my);
      st.hover = hit.agent ? hit.agent.id : null;
      st.hoverLot = hit.agent || hit.lot == null || hit.room ? -1 : hit.lot;
      cv.style.cursor = hit.agent || hit.lot != null ? 'pointer' : 'grab';
    });
    cv.addEventListener('pointerup', e => {
      const was = moved;
      drag = null; moved = false; cv.style.cursor = 'grab';
      if (was || !IB.S) return;
      const [mx, my] = pos(e), hit = pick(mx, my);
      if (hit.agent) cb.onAgent(hit.agent);
      else if (hit.lot != null) cb.onLot(hit.lot, hit.room);
    });
    cv.addEventListener('pointerleave', () => { st.hover = null; st.hoverLot = -1; });
    cv.addEventListener('wheel', e => {
      e.preventDefault();
      const [mx, my] = pos(e), z0 = view.zoom, z1 = Math.max(0.7, Math.min(3.2, z0 * (e.deltaY < 0 ? 1.12 : 0.89)));
      if (z1 === z0) return;
      // 以指针为中心缩放
      const w = toWorld(mx, my);
      view.zoom = z1;
      const s1 = Math.min(cw / LW, ch / LH) * z1;
      view.px = mx - w.lx * s1 - (cw - LW * s1) / 2;
      view.py = my - w.ly * s1 - (ch - LH * s1) / 2;
    }, { passive: false });
  }
  function zoomBy(f) { view.zoom = Math.max(0.7, Math.min(3.2, view.zoom * f)); }
  function resetView() { view.zoom = 1; view.px = 0; view.py = 0; }
  function focus(x, y) {
    const p = P(x, y), s = Math.min(cw / LW, ch / LH) * view.zoom;
    view.px = cw / 2 - p[0] * s - (cw - LW * s) / 2;
    view.py = ch / 2 - p[1] * s - (ch - LH * s) / 2;
  }
  return { init, draw, resize, zoomBy, resetView, focus, state: st, view };
})();

        (x.kind === 'w' ? h(D.COURSE[x.course].short) + ' 笔试' : '实操考核') + ' ' + (x.st === 'run' ? '<span class="tag b">进行中</span>' : '') + '<div class="row" style="margin-top:3px">' + x.cids.map(cid => { const c = IB.C(cid); return c ? '<button class="btn sm" data-act="cit" data-id="' + c.id + '">' + h(c.name) + '</button>' : ''; }).join('') + '</div></div>').join('') : '<div class="sm mut">暂无预约。</div>');
    }
    if (rm.type === 'grading') o += '<h3>阅卷</h3><div class="sm">待批 <b>' + S.gq.length + '</b> 份。成绩最早在考试次营业日发布，本人返访查分后才生效。' + (S.policies.aiGrading ? ' AI 辅助阅卷已启用（仍需阅卷员在岗签字）。' : '') + '</div>';
    if (rm.type === 'bookstore') o += '<div class="row">' + btn('tab', '管理库存与进货', 'data-v="course"', 'sm') + '</div>';
    if (rm.type === 'liaison') o += '<div class="row">' + btn('tab', '查看机构升级进度', 'data-v="audit"', 'sm') + '</div>';
    if (rm.type === 'petition') o += '<div class="sm">' + (S.petitions.length ? '有 ' + S.petitions.length + ' 位公民在等候裁决。' : '连续落榜的公民会来这里向局长申诉。') + '</div>';
    const back = Math.round(def.cost * 0.3);
    o += '<h3>拆除</h3><div class="row">' + btn('demolish', ui.confirm === 'demo' + rm.id ? '确认拆除？' : '拆除房间（返还 ' + back + '）', 'data-id="' + rm.id + '"', 'sm warn') + '<span class="sm mut">房间内有人办理或有已预约场次时无法拆除。</span></div>';
    return '<div class="dlg"><header><span class="sw" style="background:' + def.color + ';width:20px;height:20px;border:1px solid var(--line)"></span><h2>' + h(def.name) + '<small>' + h(roomLabel(rm)) + '</small></h2><button class="x" data-act="close">×</button></header><div class="body">' + o + '</div></div>';
  }
  function buildModal(lot) {
    const S = IB.S;
    let o = '<div class="buildgrid">';
    for (const t of D.ROOM_ORDER) {
      const def = D.ROOMS[t], has = S.rooms.some(r => r.type === t);
      const why = !def.multi && has ? '已建成（只能建一间）' : S.cash < def.cost ? '现金不足' : '';
      o += '<div class="card' + (why ? ' dis' : '') + '" ' + (why ? '' : 'data-act="build" data-id="' + lot + '" data-v="' + t + '"') + '><div class="row sp"><b><span class="sw" style="background:' + def.color + ';border:1px solid var(--line)"></span> ' + h(def.name) + '</b><span class="b">' + money(def.cost) + '</span></div>' +
        '<div class="sm mut">' + h(def.desc) + '</div><div class="sm">维护 ' + def.upkeep + '/日' + (def.job ? ' · 需' + D.JOBS[def.job].name + (D.JOBS[def.job].temp ? '（临时合同）' : '') : ' · 无需排班') + (why ? ' · <span class="bad">' + why + '</span>' : '') + '</div></div>';
    }
    return '<div class="dlg wide"><header><h2>在空地上建造<small>现金 ' + money(S.cash) + ' · 单层平面，共 ' + IB.geo.LOT_COUNT + ' 块地</small></h2><button class="x" data-act="close">×</button></header><div class="body">' + o + '</div></div></div>';
  }
  function menuModal() {
    const chk = (k, label) => '<label class="row"><input type="checkbox" data-chg="opt" data-k="' + k + '"' + (ui[k] ? ' checked' : '') + '> ' + label + '</label>';
    return '<div class="dlg"><header><h2>菜单</h2><button class="x" data-act="close">×</button></header><div class="body">' +
      '<h3>存档</h3><div class="row">' + btn('save', '💾 存档') + btn('load', '📂 读取存档') + btn('export', '⬇ 导出 JSON') + btn('import', '⬆ 导入 JSON') + '</div>' +
      '<div class="sm mut" style="margin-top:4px">存档保存在本机浏览器内；长期游玩后存档会达到数 MB，建议定期导出 JSON 备份。</div>' +
      '<h3>设置</h3>' + chk('sound', '音效') + chk('autosave', '每个营业日开门时自动存档') + chk('petPause', '有公民祈愿时自动暂停') +
      '<h3>其他</h3><div class="row">' + btn('rename', '修改昵称与中心名称') + btn('help', '玩法说明') + btn('restart', ui.confirm === 'restart' ? '确认放弃当前进度？' : '重新开局', '', 'warn') + '</div></div></div>';
  }
  function renameModal() {
    const S = IB.S;
    return '<div class="dlg"><header><h2>修改名称</h2><button class="x" data-act="close">×</button></header><div class="body">' +
      '<div class="row" style="margin-bottom:8px"><span style="width:90px">局长昵称</span><input type="text" id="rn-player" maxlength="24" value="' + h(S.player) + '" style="flex:1"></div>' +
      '<div class="row" style="margin-bottom:10px"><span style="width:90px">中心名称</span><input type="text" id="rn-center" maxlength="28" value="' + h(S.center) + '" style="flex:1"></div>' +
      '<div class="row">' + btn('renameOk', '保存', '', 'pri') + '<span class="sm mut">改名后招牌、公告与后续记录同步更新；已写入履历的旧记录保持原样。</span></div></div></div>';
  }
  function helpModal(first) {
    const S = IB.S;
    return '<div class="dlg wide"><header><h2>' + (first ? '欢迎上任，' + h(S.player) + ' 局长' : '玩法说明') + '<small>' + h(S.center) + '</small></h2><button class="x" data-act="close">×</button></header><div class="body">' +
      '<div class="hint">技术上，公民只需要按下那个绿色的“自动修复”按钮。但在按下之前，他们得先考完七项认证、交齐材料、等上级电子签发、再排队等名额。你负责让这一切“合规地”运转。</div>' +
      '<div class="grid2"><div><h3>公民怎么行动</h3><div class="sm">登记建档 → 材料审核（可能缺件，回家补件再来）→ 收费室缴费并预约 → 按预约日到考 → 试卷封存、阅卷员批阅 → 最早次营业日发布 → <b>本人再来一趟查分</b> → 合格进入下一项，不合格自己决定买教辅、请私教、回家复习或直接再约。</div>' +
      '<h3>钱从哪里来</h3><div class="sm">每日定额拨款，加上真实发生的登记、到访、报名、咨询、教材等收费。补考不加价。没缴费就走出离场线的，账就挂在那里，不追缴——除非大门有巡查员拦下。</div></div>' +
      '<div><h3>你能做什么</h3><div class="sm">· 点击<b>空地</b>建房，点击<b>房间</b>看排班与场次，点击<b>人物</b>看五页档案。<br>· <b>员工排班</b>：向人事编制署申请正式员工（次日答复，可能不对口）；巡查员、外联跑证员只能从来访公民里签临时合同。<br>· <b>公民与个案</b>：处理续考祈愿，每天可鼓励 3 人次。<br>· <b>课程与书店</b>：进货、换版、看考试日程。<br>· <b>审计与政策</b>：看账、申请机构升级、开关政策。</div>' +
      '<h3>开局提示</h3><div class="sm">一级中心只能受理前两项认证。攒够真实到考与报名数据后，建政务联络处、签一名外联跑证员，去申请升级。开局那位巡查员的合同第 10 个营业日到期，记得续签。</div></div></div>' +
      '<div class="row" style="margin-top:12px">' + btn('close', first ? '开门营业' : '知道了', '', 'pri') + '</div></div></div>';
  }
  function renderModal() {
    const m = ui.modal, el = $('modal');
    if (!m) { if (!el.hidden) { el.hidden = true; el.innerHTML = ''; } return; }
    let html = '';
    if (m.t === 'cit') { const c = IB.C(m.id); if (c) html = citModal(c); }
    else if (m.t === 'room') { const rm = IB.Rm(m.id); if (rm) html = roomModal(rm); }
    else if (m.t === 'build') html = IB.lotFree(m.lot) ? buildModal(m.lot) : '';
    else if (m.t === 'menu') html = menuModal();
    else if (m.t === 'rename') html = renameModal();
    else if (m.t === 'help') html = helpModal(m.first);
    if (!html) { ui.modal = null; el.hidden = true; el.innerHTML = ''; return; }
    const body = el.querySelector('.body'), top = body ? body.scrollTop : 0, same = el.dataset.key === m.t + ':' + (m.id || m.lot || '') + ':' + (m.t === 'cit' ? ui.citTab : '');
    el.innerHTML = html; el.hidden = false;
    el.dataset.key = m.t + ':' + (m.id || m.lot || '') + ':' + (m.t === 'cit' ? ui.citTab : '');
    const nb = el.querySelector('.body');
    if (nb && same) nb.scrollTop = top;
  }

  // ---------- 刷新 ----------
  const editing = box => { const a = document.activeElement; return a && box.contains(a) && (a.tagName === 'SELECT' || a.tagName === 'INPUT'); };
  function renderPanel() {
    const S = IB.S;
    const dots = { staff: S.apps.filter(a => a.cand).length, cit: S.petitions.length, course: 0, audit: (S.up.stage === 'pack' || S.up.stage === 'ready' || S.up.stage === 'rejected') ? 1 : 0 };
    $('tabs').innerHTML = TABS.map(t => '<button data-act="tab" data-v="' + t[0] + '" class="' + (ui.tab === t[0] ? 'on' : '') + '">' + t[1] + (dots[t[0]] ? '<span class="dot">' + dots[t[0]] + '</span>' : '') + '</button>').join('');
    $('tabbody').innerHTML = ui.tab === 'staff' ? tabStaff() : ui.tab === 'cit' ? tabCit() : ui.tab === 'course' ? tabCourse() : tabAudit();
  }
  function refresh(force) {
    if (!ui.started) return;
    updTop();
    renderOverlays();
    if (force || !(ui.down || editing($('panel')))) renderPanel();
    if (force || !(ui.down || editing($('modal')))) renderModal();
    ui.nextRefresh = performance.now() + 450;
  }

  // ---------- 时间推进 ----------
  function onNewDay(quiet) {
    const r = IB.S.lastReport;
    if (r && !quiet) toast(IB.dateStr(r.day) + ' 结算：收入 ' + money(r.inc) + '，支出 ' + money(Math.abs(r.exp)) + '，净额 ' + (r.net >= 0 ? '+' : '') + money(r.net) + '，到访 ' + r.vis + ' 人次');
    if (ui.autosave) saveGame(true);
  }
  function checkPetition() {
    const n = IB.S.petitions.length;
    const more = n > ui.pets;
    ui.pets = n;
    if (more && ui.petPause && !ui.paused) { ui.paused = true; toast('有公民在祈愿室等候裁决，已自动暂停'); }
    return more;
  }
  function skip(mode) {
    const S0 = IB.S, target = S0.day + (mode === 'day' ? 1 : 5), k0 = S0.keySeq;
    let guard = 5 * 600 + 20, days = 0, why = '';
    while (IB.S.day < target && guard-- > 0) {
      if (IB.tick()) days++;
      if (IB.S.petitions.length > ui.pets) { why = '有公民祈愿，快进已停下'; break; }
      ui.pets = IB.S.petitions.length;
      if (mode === 'key' && IB.S.keySeq !== k0) { why = '出现需要关注的事件'; break; }
    }
    drainFX(true);
    ui.acc = 0;
    if (days) onNewDay(true);
    if (why) { ui.paused = true; ui.pets = IB.S.petitions.length; toast(why + '（已暂停）'); beep('ask'); }
    else toast('已快进到 ' + IB.dateStr(IB.S.day) + ' ' + IB.timeStr(IB.S.minute));
    refresh(true);
  }
  function frame(ts) {
    requestAnimationFrame(frame);
    if (!ui.started) return;
    const dt = Math.min(0.25, (ts - ui.last) / 1000 || 0);
    ui.last = ts;
    let ticked = false;
    if (!ui.paused) {
      ui.acc += dt * TICKS_PER_SEC * ui.speed;
      let n = 0;
      while (ui.acc >= 1 && n < 12) {
        ui.acc -= 1; n++; ticked = true;
        if (IB.tick()) onNewDay(false);
        if (checkPetition()) { ui.acc = 0; break; }
      }
      if (ui.acc > 1) ui.acc = 1;
    }
    if (ticked) drainFX(false);
    RENDER.draw(ui.paused ? 1 : Math.min(1, ui.acc));
    if (ticked || ts > ui.nextRefresh) { if (ts > ui.nextRefresh) refresh(false); else updTop(); }
  }

  // ---------- 交互 ----------
  const ACT = {
    start: startNew,
    async continue() { const j = await readSave(); if (j) applyLoaded(j); else renderStart('没有找到存档。'); },
    import() { $('importfile').value = ''; $('importfile').click(); },
    speed(d) { const v = +d.v; if (!v) ui.paused = !ui.paused; else { ui.speed = v; ui.paused = false; } beep('click'); },
    skip(d) { skip(d.v); },
    tab(d) { ui.tab = d.v; ui.modal = null; ui.confirm = ''; $('tabbody').scrollTop = 0; },
    menu() { ui.modal = { t: 'menu' }; },
    help() { ui.modal = { t: 'help' }; },
    rename() { ui.modal = { t: 'rename' }; },
    renameOk() { IB.rename($('rn-player').value, $('rn-center').value); ui.modal = null; toast('名称已更新'); },
    close() { ui.modal = null; ui.confirm = ''; },
    zoom(d) { const f = +d.a; if (f) RENDER.zoomBy(f); else RENDER.resetView(); },
    cit(d) { ui.modal = { t: 'cit', id: +d.id }; ui.citTab = d.v || ui.citTab; if (d.k) { ui.offer.job = d.k; ui.offer.wage = D.JOBS[d.k].wage; } const c = IB.C(+d.id); if (c && c.agent) RENDER.state.sel = c.agent; },
    citTab(d) { ui.citTab = d.v; },
    locate(d) { const a = IB.A(+d.id); if (a) { RENDER.state.sel = a.id; RENDER.focus(a.x, a.y); ui.modal = null; } },
    pet(d) { res(IB.petitionDecide(+d.id, d.v)); ui.pets = IB.S.petitions.length; beep('stamp'); },
    enc(d) { res(IB.encourage(+d.id, d.v)); },
    mid(d) { if (!IB.reorderMid(+d.id, d.k, +d.v)) toast('只能调整尚未报考的中段科目', true); },
    offer(d) { const f = ui.offer; const r = IB.offerTemp(+d.id, f.job, f.wage, f.days, f.swap); res(r); if (r.accepted) { beep('pass'); f.swap = false; } },
    gotoStaff(d) { ui.tab = 'staff'; ui.hl = +d.id; ui.modal = null; setTimeout(() => { const el = $('stf' + d.id); if (el) el.scrollIntoView({ block: 'center' }); }, 30); },
    apply() { res(IB.applyFormal(ui.applyJob)) && toast('申请已提交，最早次营业日答复'); },
    accept(d) { const r = IB.acceptCandidate(+d.id); if (res(r) && r.staff) { ui.hl = r.staff.id; toast(r.staff.name + ' 已入职'); } },
    decline(d) { res(IB.declineCandidate(+d.id)); },
    bonus(d) { res(IB.bonus(+d.id)); },
    renew(d) { res(IB.renew(+d.id, ui.renewDays[d.id] || 5)); },
    dismiss(d) { const k = 'dismiss' + d.id; if (ui.confirm !== k) { ui.confirm = k; return; } ui.confirm = ''; res(IB.dismiss(+d.id)); },
    buy(d) { res(IB.buyStock(d.id, +d.v)); },
    recycle(d) { const r = IB.recycleOld(d.id); if (res(r)) toast('已回收，回款 ' + r.back); },
    policy(d) { res(IB.togglePolicy(d.id)); beep('stamp'); },
    upStart() { res(IB.startUpgrade()); },
    upSend() { res(IB.sendLiaison()); },
    stamp(d) { res(IB.stampProof(+d.v)); },
    build(d) { const r = IB.buildRoom(d.v, +d.id); if (res(r)) { ui.modal = { t: 'room', id: r.room.id }; toast('已建成 ' + D.ROOMS[d.v].name); } },
    demolish(d) { const k = 'demo' + d.id; if (ui.confirm !== k) { ui.confirm = k; return; } ui.confirm = ''; const r = IB.demolishRoom(+d.id); if (res(r)) { ui.modal = null; toast('已拆除'); } },
    save() { saveGame(false); },
    async load() { const j = await readSave(); if (j) applyLoaded(j); else toast('没有找到存档', true); },
    export: exportJSON,
    restart() { if (ui.confirm !== 'restart') { ui.confirm = 'restart'; return; } ui.confirm = ''; ui.started = false; ui.modal = null; renderModal(); $('app').hidden = true; $('start').hidden = false; renderStart(); },
  };
  const CHG = {
    duty(v, d) { res(IB.setDuty(+d.id, v)); },
    assign(v, d) { res(IB.assignStaff(+d.id, v ? +v : 0)); },
    rest(v, d) { res(IB.setRest(+d.id, v)); },
    renewDays(v, d) { ui.renewDays[d.id] = +v; },
    applyJob(v) { ui.applyJob = v; },
    filter(v) { ui.filter = v; },
    offerJob(v) { ui.offer.job = v; ui.offer.wage = D.JOBS[v].wage; },
    offerWage(v) { ui.offer.wage = Math.max(40, Math.min(200, Math.round(+v) || 40)); },
    offerDays(v) { ui.offer.days = +v; },
    offerSwap(v, d, el) { ui.offer.swap = el.checked; },
    opt(v, d, el) { ui[d.k] = el.checked; saveOpt(); },
  };
  function boot() {
    document.addEventListener('click', e => {
      const el = e.target.closest('[data-act]');
      if (!el || el.disabled) {
        if (e.target.id === 'modal') { ui.modal = null; ui.confirm = ''; refresh(true); }
        return;
      }
      const f = ACT[el.dataset.act];
      if (!f) return;
      const r = f(el.dataset, el);
      if (!ui.started) return;
      if (r && r.then) r.then(() => refresh(true)); else refresh(true);
    });
    document.addEventListener('change', e => {
      const el = e.target;
      if (el.id === 'importfile') {
        const file = el.files && el.files[0];
        if (!file) return;
        const rd = new FileReader();
        rd.onload = () => { if (!applyLoaded(String(rd.result)) && !ui.started) renderStart('导入失败：文件不是有效的存档。'); };
        rd.readAsText(file);
        return;
      }
      const f = el.dataset && CHG[el.dataset.chg];
      if (!f) return;
      f(el.value, el.dataset, el);
      el.blur();
      refresh(true);
    });
    document.addEventListener('input', e => {
      if (e.target.dataset && e.target.dataset.inp === 'q') { ui.q = e.target.value; const l = $('citlist'); if (l) l.innerHTML = citRows(); }
    });
    document.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') {
        if (e.key === 'Enter' && (e.target.id === 'in-player' || e.target.id === 'in-center')) startNew();
        return;
      }
      if (!ui.started) return;
      if (e.key === 'Escape' && ui.modal) { ui.modal = null; ui.confirm = ''; refresh(true); }
      else if (e.key === ' ') { e.preventDefault(); ui.paused = !ui.paused; refresh(false); }
      else if (e.key === '1' || e.key === '2' || e.key === '4') { ui.speed = +e.key; ui.paused = false; refresh(false); }
    });
    document.addEventListener('pointerdown', e => { if (e.target.closest('#panel, #modal')) ui.down = true; });
    document.addEventListener('pointerup', () => { ui.down = false; });
    document.addEventListener('pointercancel', () => { ui.down = false; });
    window.addEventListener('beforeunload', e => { if (ui.started) { e.preventDefault(); e.returnValue = ''; } });
    RENDER.init($('map'), {
      onAgent(a) {
        RENDER.state.sel = a.id;
        if (a.k === 'cit') { ui.modal = { t: 'cit', id: a.cid }; }
        else if (a.k === 'stf') { const s = IB.St(a.sid); if (s) ACT.gotoStaff({ id: s.id }); }
        else toast(a.name + (a.role === 'review' ? '：正在复核机构升级申请' : '：正在例行审查，结论会写入审计页'));
        refresh(true);
      },
      onLot(lot, rm) { ui.confirm = ''; ui.modal = rm ? { t: 'room', id: rm.id } : { t: 'build', lot }; refresh(true); },
    });
    if (window.ResizeObserver) new ResizeObserver(() => RENDER.resize()).observe($('mapwrap'));
    renderStart();
    readSave().then(j => { if (j && !ui.started) { ui.hasSave = true; const p = $('in-player').value, c = $('in-center').value; renderStart(); $('in-player').value = p; $('in-center').value = c; } });
    requestAnimationFrame(frame);
  }
  boot();
  return { ui, refresh, toast };
})();

</script>
</body>
</html>
